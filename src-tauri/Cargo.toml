[package]
name = "coconut-app"
version = "0.3.0"
description = "椰果工具箱启动器"
authors = ["Coconut"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"
tar = "0.4"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs", "cors", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
bytes = "1"
rand = "0.8"
url = "2"
flate2 = "1"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }
rquickjs = "0.8.1"
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
